# posts/ altına yeni bir .md eklenip main'e push'landığında site otomatik build edilip yayınlanır
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch PPOD
        run: git clone --depth 1 --branch main https://github.com/Padrosum/ppod.git .ppod
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build PPOD
        working-directory: .ppod
        run: |
          npm ci
          npm run build
          rm -rf .git
      - name: Add PPOD to Next public assets
        run: mkdir -p public/ppod && cp -R .ppod/dist/ppod/. public/ppod/
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
